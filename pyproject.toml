[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "passiq"
version = "0.1.0"
description = "Reproducible football passing-decision intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "matplotlib>=3.8,<3.11",
  "mplsoccer>=1.4,<1.7",
  "pandas>=2.2,<3.0",
  "pyarrow>=16,<20",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["dbt-duckdb>=1.9,<2.0", "duckdb>=1.1,<2.0", "pytest>=8.0,<9.0", "ruff>=0.8,<1.0"]

[project.scripts]
passiq = "passiq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/passiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

